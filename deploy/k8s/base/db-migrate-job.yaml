# Applies backend/db/schema.sql (shipped in the backend image) — idempotent, safe to re-run on
# every deploy:  kubectl -n sdm delete job db-migrate --ignore-not-found && kubectl apply -k ...
apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: sdm-backend
          command: ["python", "-m", "src.persistence.migrate"]
          envFrom:
            - configMapRef: { name: sdm-config }
            - secretRef: { name: sdm-secrets }
