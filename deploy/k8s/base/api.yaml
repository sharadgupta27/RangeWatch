apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector: { app: api }
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: api
          image: sdm-backend
          args:
            - uvicorn
            - src.api.main:app
            - --host=0.0.0.0
            - --port=8000
            - --root-path=/api
            - --proxy-headers
            - --forwarded-allow-ips=*
          envFrom:
            - configMapRef: { name: sdm-config }
            - secretRef: { name: sdm-secrets }
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 30
          resources:
            requests: { cpu: 200m, memory: 512Mi }
          volumeMounts:
            - { name: data, mountPath: /data, readOnly: true }
            - { name: artifacts, mountPath: /artifacts, readOnly: true }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: sdm-data }
        - name: artifacts
          persistentVolumeClaim: { claimName: sdm-artifacts }
