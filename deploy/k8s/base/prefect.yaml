apiVersion: v1
kind: Service
metadata:
  name: prefect
spec:
  selector: { app: prefect }
  ports:
    - port: 4200
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prefect
spec:
  replicas: 1
  selector:
    matchLabels: { app: prefect }
  template:
    metadata:
      labels: { app: prefect }
    spec:
      containers:
        - name: prefect
          image: prefecthq/prefect:3-latest
          args: ["prefect", "server", "start", "--host", "0.0.0.0"]
          ports:
            - containerPort: 4200
          readinessProbe:
            httpGet: { path: /api/health, port: 4200 }
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 512Mi }
