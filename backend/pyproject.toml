[project]
name = "rangewatch-backend"
version = "0.1.0"
description = "RangeWatch: MLOps backend for living species distribution models, range projections and bulletins"
requires-python = ">=3.11"
# Versions of elapid / pygbif / pyinaturalist / rasterio are pinned exactly: they are
# logged per model version for reproducibility (see CLAUDE.md "Reproducibility").
dependencies = [
    "elapid==1.0.4",
    "pygbif==0.6.6",
    "pyinaturalist==0.21.1",
    "rasterio==1.5.0",
    "rioxarray>=0.17",
    "xarray>=2024.1",
    "geopandas>=1.0",
    "shapely>=2.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "geoalchemy2>=0.15",
    "celery[redis]>=5.4",
    "prefect>=3.0",
    "mlflow-skinny>=2.14",
    "jinja2>=3.1",
    "weasyprint>=62",
    "matplotlib>=3.9",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5", "black>=24"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-data]
"src.bulletin" = ["templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::PendingDeprecationWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # FastAPI Depends() in defaults

[tool.black]
line-length = 100
target-version = ["py311"]
